<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathe üben</title>
<link rel="stylesheet" href="vorlage/design.css">
</head>
<body>
<main class="start">
  <h1>Mathe üben</h1>
  <div class="kacheln" id="kacheln"></div>
</main>

<script src="themen/liste.js"></script>
<script>
  // Jede Übung aus themen/liste.js laden und ihre Daten sammeln
  window.KACHELN = [];
  window.UEBUNGEN.forEach(function (id) {
    document.write('<script src="themen/' + id + '.js"><\/script>' +
                   '<script>KACHELN.push(window.THEMA);<\/script>');
  });
</script>
<script>
  // Kacheln zeichnen, jede in der Farbe ihrer Übung
  KACHELN.forEach(function (t) {
    var a = document.createElement("a");
    a.className = "kachel";
    a.href = t.id + "/";
    if (t.farbe) a.style.setProperty("--akzent", t.farbe);
    var b = document.createElement("b");
    b.textContent = t.titel;
    a.appendChild(b);
    if (t.untertitel) {
      var s = document.createElement("span");
      s.textContent = t.untertitel;
      a.appendChild(s);
    }
    document.getElementById("kacheln").appendChild(a);
  });
</script>
</body>
</html>
